name: 5sec-tools UX Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ux-gate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ux:gate
